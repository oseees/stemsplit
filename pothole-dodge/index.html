<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dodge Dat Pothole — Naija Road Rally</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d0c;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;aspect-ratio:360/640;touch-action:none;display:block}
</style>
<canvas id=c></canvas>
<script>
const W=360, H=640, ROAD_L=44, ROAD_R=316, MINGAP=58;
// ponytail: 3.2px per km/h keeps a real 210km/h G-Wagon readable on a 640px screen
const KMH=3.2;
const cv=document.getElementById('c'), g=cv.getContext('2d');
cv.width=W*2; cv.height=H*2; g.scale(2,2);

// obstacle kinds. rel = how fast they roll forward vs the road (0 = parked pothole)
// kmh = what the thing actually does on a Lagos road. rel is that as a fraction of REF, which is
// what the scrolling maths wants: a loaded tanker crawls, so it falls back fastest of the vehicles.
const REF=110;
const KINDS={
  pothole:{w:64,h:28,  kmh:0,  weight:4},   // it is the road
  goat:   {w:46,h:34,  kmh:5,  weight:2},   // walking pace
  okada:  {w:32,h:54,  kmh:40, weight:3},   // 100cc, fully loaded, no helmet
  car:    {w:42,h:76,  kmh:70, weight:4},   // ordinary traffic
  danfo:  {w:70,h:100, kmh:55, weight:2},   // stops every 50 metres
  tanker: {w:88,h:150, kmh:45, weight:1}    // 33,000 litres, going uphill in third
};
for(const d of Object.values(KINDS)) d.rel=d.kmh/REF;
const PAINT=['#c8ccd2','#8f2f2f','#2c5c96','#1f2429','#c9a227','#356b4c','#e8e8e8','#6b4a8f'];
const BAG=Object.entries(KINDS).flatMap(([k,v])=>Array(v.weight).fill(k));
const CRASHES=["Your shock absorber don go!","Mechanic don see money today.","Na so pothole take chop that tyre.",
  "You for dodge am now!","Wetin you dey look? Road no be Instagram.","That one na crater, no be pothole."];

// pick your ride. top/s100 are the real-world numbers, thirst is how hard it drinks,
// grip is how fast it answers the steering, w is how much road it takes up.
const CARS=[
  {name:'Tokunbo Corolla', col:'#2f7ad6', w:38,h:68, grip:14, top:180,s100:10, thirst:1,   cruise:.58,
   blurb:'nothing spectacular, never fails'},
  {name:'Okada',           col:'#c1442e', w:26,h:52, grip:20, top:95, s100:13, thirst:.5, cruise:.82, bike:true,
   blurb:'thin, slow flat out, sips fuel'},
  {name:'Danfo Bus',       col:'#f2c53d', w:54,h:88, grip:10, top:130,s100:17, thirst:1.3, cruise:.62, van:true,
   blurb:'loaded Hiace: wide, heavy, patient'},
  {name:'Owanbe G-Wagon',  col:'#3a4048', w:46,h:74, grip:17, top:210,s100:6,  thirst:1.6, cruise:.5, suv:true,
   blurb:'V8 — pulls hard, drinks harder'}
];
for(const c of CARS) c.accel=100/c.s100;          // km/h per second, straight off the 0-100 time
let pick=Math.min(CARS.length-1,+localStorage.potholeCar||0);

let st, best=+localStorage.potholeBest||0;
const keys={};

function reset(){
  st={mode:'menu',car:{x:W/2,tx:W/2,...CARS[pick]},obs:[],pops:[],trees:[],
      dist:0,score:0,lives:3,kmh:48,spd:48*KMH,maxKmh:0,t:0,next:1.6,shake:0,inv:0,msg:'',title:'',flash:0,hornCd:0,
      fuel:1,boost:0,gas:false,gasBtn:false,warned:false,nextFuel:3,nextBoost:9};
  for(let i=0;i<12;i++) st.trees.push({x:Math.random()<.5?18:W-18,y:i*70,k:Math.random()});
}
reset();

// --- the only fiddly bit: never spawn a wall the player can't get through ---
function gapOK(spans){
  const s=[...spans].sort((a,b)=>a[0]-b[0]);
  let cur=ROAD_L, gap=0;
  for(const [a,b] of s){ gap=Math.max(gap,a-cur); cur=Math.max(cur,b); }
  return Math.max(gap,ROAD_R-cur)>=MINGAP;
}
// a tanker is 150 tall and spawns mostly above the screen, so "is that spot free" has to be a
// box test, not an x test — otherwise the next bike lands inside it and they drive along fused
const boxFree=(x,y,w,h)=>!st.obs.some(o=>Math.abs(o.x-x)<(o.w+w)/2+6 && Math.abs(o.y-y)<(o.h+h)/2+10);
function spawn(){
  const k=BAG[Math.random()*BAG.length|0], d=KINDS[k], y=-d.h-10;
  // check against everything still ahead of the car: a fast pothole catches a slow tanker,
  // so two obstacles that spawned apart can end up in the same band with no way through
  const ahead=st.obs.filter(o=>!o.good&&o.y<H-150).map(o=>[o.x-o.w/2,o.x+o.w/2]);
  for(let i=0;i<8;i++){
    const x=ROAD_L+d.w/2+Math.random()*(ROAD_R-ROAD_L-d.w);
    if(!gapOK([...ahead,[x-d.w/2,x+d.w/2]])) continue;   // would wall the road off
    if(!boxFree(x,y,d.w,d.h)) continue;                  // would land on somebody
    st.obs.push({k,x,y,w:d.w,h:d.h,rel:d.rel,drift:(Math.random()-.5)*20,passed:false,
      col:PAINT[Math.random()*PAINT.length|0],suv:Math.random()<.35}); return;
  }
}
// pickups ride in the same list as obstacles — one loop moves and collides everything
function spawnPick(kind){
  const w=28,h=34,y=-40;
  for(let i=0;i<6;i++){
    const x=ROAD_L+w/2+Math.random()*(ROAD_R-ROAD_L-w);
    if(boxFree(x,y,w,h)){ st.obs.push({k:kind,good:kind,x,y,w,h,rel:0,drift:0,passed:true}); return; }
  }
}

// ---------- sound: all synthesised, no files to ship ----------
const A={ctx:null,eng:null,on:localStorage.potholeMute!=='1'};
function ac(){ const a=A.ctx||(A.ctx=new (window.AudioContext||webkitAudioContext)());
  if(a.state==='suspended') a.resume(); return a; }
function beep(f,dur,type='square',vol=.18,slideTo){
  if(!A.on) return;
  try{ const a=ac(), o=a.createOscillator(), gn=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,a.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);
    o.connect(gn); gn.connect(a.destination);
    gn.gain.setValueAtTime(vol,a.currentTime); gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
function engine(on){
  if(A.eng && (!on||!A.on)){ try{A.eng.o.stop();}catch(e){} A.eng=null; return; }
  if(!on||!A.on||A.eng) return;
  try{ const a=ac(), o=a.createOscillator(), f=a.createBiquadFilter(), gn=a.createGain();
    o.type='sawtooth'; o.frequency.value=55; f.type='lowpass'; f.frequency.value=420; gn.gain.value=.05;
    o.connect(f); f.connect(gn); gn.connect(a.destination); o.start(); A.eng={o};
  }catch(e){}
}
function pause(on){
  if(st.mode!=='play'&&st.mode!=='pause') return;
  st.mode=on?'pause':'play'; st.gasBtn=false;      // never hold the gas through a pause
  engine(st.mode==='play'); beep(on?300:520,.09);
}
function mute(){
  A.on=!A.on; localStorage.potholeMute=A.on?'0':'1';
  engine(A.on && st.mode==='play'); if(A.on) beep(660,.08);
}
function horn(){
  if(st.mode!=='play'||st.hornCd>0) return;
  st.hornCd=1.1;
  beep(400,.3,'square',.15); beep(505,.3,'sawtooth',.09);
  // shout at the goats and okada — they scatter. Potholes no dey hear horn.
  for(const o of st.obs) if((o.k==='goat'||o.k==='okada') && o.y>-40 && o.y<H-130){
    o.drift=(o.x<st.car.x?-1:1)*75; o.rel=Math.max(0,o.rel-30/REF);   // they lose ~30km/h scrambling
    st.pops.push({x:o.x,y:o.y-26,t:.8,txt:o.k==='goat'?'MBEEEH!':'Ah ah!'});
  }
}

function over(title,msg){
  st.mode='over'; st.title=title; st.msg=msg; st.boost=0; engine(false); beep(220,.8,'sine',.16,60);
  if(st.score>best){ best=st.score|0; localStorage.potholeBest=best; }
}
function hit(kind){
  if(st.inv>0) return;
  st.lives--; st.inv=1.4; st.shake=14; st.flash=.25; st.kmh=Math.max(35,st.kmh-20); st.spd=st.kmh*KMH;
  if(kind==='pothole') beep(150,.45,'sine',.22,40);        // suspension thud
  else beep(90,.4,'sawtooth',.2);                           // metal on metal
  if(st.lives<=0) over('YOU DON WOUND',CRASHES[Math.random()*CRASHES.length|0]);
}
function collect(o){
  if(o.good==='fuel'){
    st.fuel=Math.min(1,st.fuel+.32); st.pops.push({x:o.x,y:o.y-24,t:.9,txt:'+FUEL'});
    beep(620,.14,'triangle',.16,980);
  } else {
    st.boost=4; st.score+=50; st.pops.push({x:o.x,y:o.y-24,t:.9,txt:'TURBO! +50'});
    beep(300,.28,'square',.16,900);
  }
}

// Traffic. Everything descends at spd*(1-rel), so a bike (rel .45) closes on a danfo (.6) or
// tanker (.7) in the same lane and used to drive straight through it. Vehicles now brake for the
// one in front and get separated if they ever touch. Potholes are road surface, not traffic.
const onRoad=(x,w)=>Math.min(ROAD_R-w/2,Math.max(ROAD_L+w/2,x));
function traffic(){
  for(const o of st.obs) o.relEff=o.rel;
  const cars=st.obs.filter(o=>!o.good&&o.k!=='pothole').sort((a,b)=>a.y-b.y);
  for(let i=1;i<cars.length;i++){
    const b=cars[i];
    for(let j=0;j<i;j++){
      const a=cars[j];                       // a is ahead of b (smaller y)
      const ox=(a.w+b.w)/2-Math.abs(a.x-b.x), oy=(a.h+b.h)/2-Math.abs(a.y-b.y);
      if(ox<=0) continue;                    // different lanes, no interaction
      if(oy>0){                              // already touching: shove them apart the shorter way
        if(oy<=ox) b.y=a.y+(b.y>=a.y?1:-1)*(a.h+b.h)/2;      // park it bumper to bumper
        else {                                                // side by side: slide along the road,
          const dir=b.x>=a.x?1:-1;                            // but only whoever has kerb room left
          const bx=onRoad(b.x+dir*ox,b.w), ax=onRoad(a.x-dir*ox,a.w);
          if(Math.abs(bx-b.x)>ox-.5){ b.x=bx; b.drift=-b.drift; }
          else if(Math.abs(ax-a.x)>ox-.5){ a.x=ax; a.drift=-a.drift; }
          else b.y=a.y+(b.y>=a.y?1:-1)*(a.h+b.h)/2;           // both kerbed in: separate lengthwise
        }
      } else if(-oy<26 && b.relEff>a.relEff) b.relEff=a.relEff;   // tuck in behind and match speed
    }
  }
}
function update(dt){
  if(st.mode!=='play'){ st.t+=dt; return; }
  st.t+=dt; st.shake=Math.max(0,st.shake-dt*40); st.inv=Math.max(0,st.inv-dt); st.flash=Math.max(0,st.flash-dt);
  st.hornCd=Math.max(0,st.hornCd-dt); st.boost=Math.max(0,st.boost-dt);

  // throttle: cruise speed ramps with distance, gas and turbo raise the target
  st.gas=st.gasBtn||!!(keys.ArrowUp||keys.w||keys.W);
  const c=st.car;
  const flow=Math.min(c.top*c.cruise,58+st.dist*.09);    // a 100cc okada lives near its top speed,
                                                        // a V8 is barely trying at the same pace
  let want=st.gas?c.top:flow;                            // foot down = whatever the ride can do
  if(st.boost>0) want=Math.min(c.top*1.05,want*1.3);     // turbo leans on it a little past that
  const rate=(want>st.kmh? c.accel*(st.boost>0?1.5:1) : c.accel*2.4);   // brakes beat the engine
  st.kmh+=Math.sign(want-st.kmh)*Math.min(Math.abs(want-st.kmh),rate*dt);
  st.spd=st.kmh*KMH; st.maxKmh=Math.max(st.maxKmh,st.kmh);
  st.dist+=st.spd*dt/40; st.score+=st.spd*dt/40*(st.boost>0?2:1);
  if(A.eng) A.eng.o.frequency.value=48+st.kmh*1.9;   // engine note rises with speed

  // fuel burns faster the harder you push it
  st.fuel-=dt*(.022+(st.gas?.028:0)+(st.boost>0?.012:0))*c.thirst;   // the V8 drinks, the okada sips
  if(st.fuel<=0){ st.fuel=0; over('FUEL DON FINISH','Filling station far, and NEPA no dey help.'); return; }
  if(st.fuel<.18&&!st.warned){ st.warned=true; beep(880,.16,'square',.13);
    st.pops.push({x:W/2,y:H-190,t:1.5,txt:'FUEL DEY FINISH!'}); }
  if(st.fuel>.28) st.warned=false;
  st.nextFuel-=dt; if(st.nextFuel<=0){ spawnPick('fuel'); st.nextFuel=4.5+Math.random()*3; }
  st.nextBoost-=dt; if(st.nextBoost<=0){ spawnPick('boost'); st.nextBoost=11+Math.random()*7; }

  // steering: keys nudge the target, touch sets it
  if(keys.ArrowLeft||keys.a) st.car.tx-=340*dt;
  if(keys.ArrowRight||keys.d) st.car.tx+=340*dt;
  st.car.tx=Math.min(ROAD_R-st.car.w/2-2,Math.max(ROAD_L+st.car.w/2+2,st.car.tx));
  st.car.x+=(st.car.tx-st.car.x)*Math.min(1,dt*st.car.grip);

  st.next-=dt;
  if(st.next<=0){ spawn(); st.next=Math.max(.34,1.15-st.spd/700); }

  const cy=H-96, cw=st.car.w, ch=st.car.h;
  traffic();
  for(const o of st.obs){
    o.y+=st.spd*(1-o.relEff)*dt;
    if(o.k==='goat'||o.k==='okada'){ o.x+=o.drift*dt; if(o.x<ROAD_L+o.w/2||o.x>ROAD_R-o.w/2) o.drift*=-1; }
    const dx=Math.abs(o.x-st.car.x)-(o.w+cw)/2*0.86, dy=Math.abs(o.y-cy)-(o.h+ch)/2*0.86;
    if(dx<0&&dy<0){ if(o.good){ collect(o); o.y=H+999; } else hit(o.k); }
    else if(!o.passed&&o.y-o.h/2>cy+ch/2){
      o.passed=true;
      if(dx<14){ st.score+=25; st.pops.push({x:o.x,y:o.y-30,t:.9,txt:'+25 SHAKARA'}); beep(880,.08); }
    }
  }
  traffic();                       // again after everyone moved: drift and braking can still touch
  st.obs=st.obs.filter(o=>o.y<H+180);
  for(const p of st.pops) { p.t-=dt; p.y-=30*dt; }
  st.pops=st.pops.filter(p=>p.t>0);
  for(const t of st.trees){ t.y+=st.spd*dt; if(t.y>H+40){ t.y-=H+80; t.x=Math.random()<.5?18:W-18; t.k=Math.random(); } }
}

// ---------- drawing ----------
function road(){
  g.fillStyle='#20361f'; g.fillRect(0,0,W,H);                     // bush
  g.fillStyle='#3a3a38'; g.fillRect(ROAD_L,0,ROAD_R-ROAD_L,H);    // tarmac
  g.fillStyle='#171716'; g.fillRect(ROAD_L-10,0,10,H); g.fillRect(ROAD_R,0,10,H);  // gutter
  g.fillStyle='#e8e2c8';
  const off=(st.dist*4)%56;
  for(const lx of [ROAD_L+(ROAD_R-ROAD_L)/3, ROAD_L+2*(ROAD_R-ROAD_L)/3])
    for(let y=-56+off;y<H;y+=56) g.fillRect(lx-2,y,4,30);
  for(const t of st.trees){                                        // palms / poles
    if(t.k<.5){ g.fillStyle='#5a4632'; g.fillRect(t.x-2,t.y,4,26);
      g.fillStyle='#2f6b33'; g.beginPath(); g.arc(t.x,t.y,13,0,7); g.fill(); }
    else { g.fillStyle='#6b6b66'; g.fillRect(t.x-2,t.y-10,4,36); }
  }
}
const mix=(hex,f,to=0)=>{ const n=parseInt(hex.slice(1),16), m=v=>Math.round(v+(to-v)*f);
  return `rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`; };
const GLASS=(y,h)=>{ const gr=g.createLinearGradient(0,y-h/2,0,y+h/2);
  gr.addColorStop(0,'#4a6b88'); gr.addColorStop(.55,'#1e3346'); gr.addColorStop(1,'#3c5a75'); return gr; };
function wheels(x,y,w,h,n=2){
  g.fillStyle='#121212';
  const ww=Math.max(5,w*.12), wh=Math.max(9,h*.15), rows=n===2?[y-h*.29,y+h*.29]:[y-h*.34,y+h*.12,y+h*.32];
  for(const wy of rows) for(const sx of [-1,1]){ g.beginPath(); g.roundRect(x+sx*w/2-ww/2,wy-wh/2,ww,wh,2); g.fill(); }
}
// top-down car: tapered body with a shading gradient, glass, mirrors, lights
function vehicle(x,y,w,h,col,o={}){
  const hw=w/2, nh=w*(o.taper??.86)/2, dark=mix(col,.52), lite=mix(col,.3,255), cw=w*(o.cabin??.74);
  g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x,y+5,hw*1.05,h*.47,0,0,7); g.fill();
  wheels(x,y,w,h);
  const gr=g.createLinearGradient(x-hw,0,x+hw,0);
  gr.addColorStop(0,dark); gr.addColorStop(.2,col); gr.addColorStop(.44,lite); gr.addColorStop(.72,col); gr.addColorStop(1,dark);
  g.beginPath();
  g.moveTo(x-nh+3,y-h/2); g.lineTo(x+nh-3,y-h/2);
  g.quadraticCurveTo(x+nh,y-h/2,x+nh+1,y-h/2+3);
  g.quadraticCurveTo(x+hw,y-h*.26,x+hw,y-h*.08);
  g.lineTo(x+hw,y+h*.26);
  g.quadraticCurveTo(x+hw,y+h/2,x+nh-2,y+h/2);
  g.lineTo(x-nh+2,y+h/2);
  g.quadraticCurveTo(x-hw,y+h/2,x-hw,y+h*.26);
  g.lineTo(x-hw,y-h*.08);
  g.quadraticCurveTo(x-hw,y-h*.26,x-nh-1,y-h/2+3);
  g.quadraticCurveTo(x-nh,y-h/2,x-nh+3,y-h/2);
  g.closePath(); g.fillStyle=gr; g.fill();
  g.fillStyle=dark; g.fillRect(x-hw-2,y-h*.16,4,5); g.fillRect(x+hw-2,y-h*.16,4,5);   // mirrors
  g.fillStyle=GLASS(y-h*.15,h*.14);                                                    // windshield
  g.beginPath(); g.roundRect(x-cw/2,y-h*.22,cw,h*.14,3); g.fill();
  g.fillStyle=mix(col,.16); g.beginPath(); g.roundRect(x-cw/2-1,y-h*.08,cw+2,h*.24,4); g.fill();  // roof
  g.fillStyle=GLASS(y+h*.22,h*.12);                                                    // rear screen
  g.beginPath(); g.roundRect(x-cw/2+1,y+h*.16,cw-2,h*.12,3); g.fill();
  if(o.rack){ g.fillStyle=mix(col,.6); g.fillRect(x-cw/2+3,y-h*.04,cw-6,2.5); g.fillRect(x-cw/2+3,y+h*.08,cw-6,2.5); }
  g.fillStyle='#ffeaa7';                                                               // headlights
  g.beginPath(); g.roundRect(x-nh+2,y-h/2,w*.17,4,2); g.fill();
  g.beginPath(); g.roundRect(x+nh-2-w*.17,y-h/2,w*.17,4,2); g.fill();
  g.fillStyle='#cf3b2c';                                                               // tail lights
  g.beginPath(); g.roundRect(x-nh+1,y+h/2-5,w*.19,4,2); g.fill();
  g.beginPath(); g.roundRect(x+nh-1-w*.19,y+h/2-5,w*.19,4,2); g.fill();
}
// danfo / minibus: flat nose, greenhouse down both sides, roof rack full of luggage
function busArt(x,y,w,h,col){
  const hw=w/2, dark=mix(col,.5), lite=mix(col,.28,255);
  g.fillStyle='rgba(0,0,0,.32)'; g.beginPath(); g.ellipse(x,y+6,hw*1.05,h*.47,0,0,7); g.fill();
  wheels(x,y,w,h);
  const gr=g.createLinearGradient(x-hw,0,x+hw,0);
  gr.addColorStop(0,dark); gr.addColorStop(.22,col); gr.addColorStop(.46,lite); gr.addColorStop(.74,col); gr.addColorStop(1,dark);
  g.fillStyle=gr; g.beginPath(); g.roundRect(x-hw,y-h/2,w,h,7); g.fill();
  g.fillStyle=GLASS(y-h*.36,h*.12); g.beginPath(); g.roundRect(x-hw+5,y-h*.42,w-10,h*.12,3); g.fill();
  g.fillStyle=mix(col,.14); g.beginPath(); g.roundRect(x-hw+3,y-h*.28,w-6,h*.6,5); g.fill();   // roof
  g.fillStyle='#1b1b1b';                                                                        // side windows
  for(let i=0;i<3;i++){ g.fillRect(x-hw+5,y-h*.24+i*h*.19,5,h*.13); g.fillRect(x+hw-10,y-h*.24+i*h*.19,5,h*.13); }
  g.fillStyle=mix(col,.55);                                                                     // roof rack
  g.fillRect(x-hw+8,y-h*.16,w-16,3); g.fillRect(x-hw+8,y+h*.08,w-16,3);
  g.fillStyle='#8a6a3a'; g.fillRect(x-14,y-h*.13,28,h*.2);                                      // load
  g.fillStyle='#ffeaa7'; g.fillRect(x-hw+4,y-h/2+1,10,4); g.fillRect(x+hw-14,y-h/2+1,10,4);

cv.addEventListener('pointerdown',e=>{

  const p=toLogical(e);
  if(inBtn(p,MUTE)){ uiPtr=e.pointerId; mute(); return; }

  if(st.mode==='menu' && p.y>400 && p.y<515){
    const i=CARS.findIndex((c,j)=>Math.abs(p.x-slotX(j))<34);
    if(i>=0){ uiPtr=e.pointerId; choose(i); return; }

  start();
});

  // horn shoving a bike into a tanker that is already hard against the kerb
  st.mode='play'; st.spd=300; st.fuel=1; st.lives=3; st.car.x=st.car.tx=290; st.hornCd=0;
  const tank={k:'tanker',x:ROAD_L+44,y:300,w:88,h:150,rel:.7,drift:0,passed:false},
        bike2={k:'okada',x:ROAD_L+110,y:300,w:32,h:54,rel:.45,drift:0,passed:false};
  st.obs=[tank,bike2]; horn();
  let stuck=0;
  for(let i=0;i<60*3;i++){ update(1/60);
    if(!st.obs.includes(tank)||!st.obs.includes(bike2)) break;
    const ov=Math.min((tank.w+bike2.w)/2-Math.abs(tank.x-bike2.x),(tank.h+bike2.h)/2-Math.abs(tank.y-bike2.y));
    if(ov>2) stuck++;
  }
  console.assert(stuck<=2,'horn-scared bike stayed inside the kerbed tanker for '+stuck+' frames');
  // a pothole is road surface — traffic must not brake for it
  st.obs=[{k:'tanker',x:200,y:100,w:88,h:150,rel:.7,drift:0,passed:false},
          {k:'pothole',x:200,y:300,w:64,h:28,rel:0,drift:0,passed:false}];
  traffic();
  console.assert(st.obs[1].relEff===0,'pothole keeps rolling under the traffic');
  // pause freezes the world and gives it back untouched
  st.mode='play'; st.fuel=1; st.lives=3; st.obs=[]; st.gasBtn=true;
  for(let i=0;i<30;i++) update(1/60);
  const frozen={score:st.score,dist:st.dist,fuel:st.fuel};
  pause(true);
  for(let i=0;i<120;i++) update(1/60);
  console.assert(st.mode==='pause','pause holds');
  console.assert(st.score===frozen.score&&st.dist===frozen.dist&&st.fuel===frozen.fuel,'paused world must not move');
  console.assert(!st.gasBtn,'pause lets go of the gas');
  pause(false); update(1/60);
  console.assert(st.mode==='play'&&st.score>frozen.score,'resume puts it back on the road');
  reset();
  document.title='tests done — check console';
}
</script>
