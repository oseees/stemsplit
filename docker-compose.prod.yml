# Production stack for the BACKEND only (frontend lives on Vercel).
# Caddy terminates HTTPS and proxies to the FastAPI backend.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"          # internal only; Caddy is the public entrypoint
    volumes:
      - stemsplit_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  stemsplit_data:
  caddy_data:
  caddy_config:
